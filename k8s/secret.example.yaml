# Copy this file to k8s/secret.yaml, replace every placeholder, then apply it.
# Do not commit k8s/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: employee-churn-secrets
  namespace: churn-prediction
type: Opaque
stringData:
  AZURE_OPENAI_API_KEY: replace-with-your-api-key
  AZURE_OPENAI_ENDPOINT: https://your-resource.openai.azure.com/
  AZURE_OPENAI_API_VERSION: replace-with-your-api-version
  AZURE_OPENAI_MODEL: replace-with-your-deployment-name
  DB_URI: mysql+pymysql://USERNAME:PASSWORD@HOST:3306/DATABASE
  HOST: 0.0.0.0
  PORT: "8000"
